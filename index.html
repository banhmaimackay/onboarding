<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>BÁNH MAI — Team Onboarding</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--green:#708E13;--green-d:#4F6800;--orange:#D3691E;--orange-d:#B5560F;--brown:#3B1F14;--cream:#F8EBC4;--bg:#FCF7E8;--card:#fff;--ink:#2d1a11;--mute:#76655a;--line:#eadfc3;--bad:#B3261E;--serif:"Cinzel","Trajan Pro","Palatino Linotype",Georgia,serif}
*{box-sizing:border-box}
body{margin:0;font:16.5px/1.55 "Segoe UI",system-ui,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
h1,h2,h3{line-height:1.25;margin:0 0 .5em}
h1,h2,.serif{font-family:var(--serif);letter-spacing:.03em;font-weight:600}
h1{font-size:1.55rem}h2{font-size:1.2rem}h3{font-size:1.05rem;font-weight:700}
a{color:var(--orange-d)}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:16px 16px 110px}
header.top{background:var(--green);color:var(--cream);position:sticky;top:0;z-index:5;box-shadow:0 2px 0 var(--green-d)}
header.top .in{max-width:980px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:12px}
header.top .mk{height:38px;width:auto}
header.top .wm{font-family:var(--serif);font-weight:600;letter-spacing:.14em;font-size:1.15rem;border-left:1px solid rgba(248,235,196,.6);padding-left:12px}
header.top .sub{flex:1;font-size:.82rem;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 20px;border-radius:10px;border:2px solid var(--orange-d);background:var(--orange-d);color:#fff;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}
.btn.ghost{background:#fff;color:var(--orange-d)}
.btn.light{background:transparent;border-color:var(--cream);color:var(--cream)}
.btn.sm{min-height:36px;padding:0 12px;font-size:.88rem;border-radius:8px}
.btn.bad{border-color:var(--bad);color:var(--bad);background:#fff}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,textarea,select{font:inherit;width:100%;padding:10px 12px;border:1.5px solid #d9c9a3;border-radius:9px;background:#fff;color:var(--ink)}
textarea{min-height:90px;resize:vertical}
input[type=checkbox],input[type=radio]{width:24px;height:24px;flex:none;accent-color:var(--orange-d);padding:0}
label.f{display:block;font-weight:600;margin:12px 0 4px;font-size:.93rem}
.req::after{content:" *";color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.muted{color:var(--mute);font-size:.9rem}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .4s}
.badge{display:inline-block;font-size:.78rem;font-weight:700;padding:2px 10px;border-radius:99px;white-space:nowrap}
.s-todo{background:#ece4d2;color:#5c5249}.s-doing{background:var(--cream);color:#6d4300}.s-done{background:#dcebb0;color:var(--green-d)}.s-signed{background:var(--brown);color:var(--cream)}.s-lock{background:#eee;color:#888}.s-fail{background:#fbdad7;color:var(--bad)}
.step{display:flex;gap:14px;align-items:center;width:100%;text-align:left;font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.step[disabled]{cursor:not-allowed;opacity:.6}
.num{width:44px;height:44px;border-radius:50%;background:var(--cream);color:var(--brown);font-family:var(--serif);font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;font-size:1.15rem}
.num.ok{background:var(--green);color:#fff}
.info{flex:1;min-width:0}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--brown);display:flex;z-index:6}
nav.tabs button{flex:1;border:0;background:none;padding:9px 2px;font:inherit;font-size:.8rem;color:#cdb892;cursor:pointer}
nav.tabs button b{display:block;font-size:1.3rem;font-weight:400}
nav.tabs button.on{color:var(--cream);font-weight:700;box-shadow:inset 0 3px 0 var(--orange)}
.atabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px}
.atabs button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:8px 16px;font:inherit;cursor:pointer}
.atabs button.on{background:var(--brown);border-color:var(--brown);color:var(--cream);font-weight:600}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:#fbf3d8;font-weight:700}
td.c,th.c{text-align:center;vertical-align:middle}
.doc h2{margin-top:1.4em;color:var(--brown)}.doc h3{margin-top:1.3em;color:var(--green-d);font-family:var(--serif);letter-spacing:.02em}
.doc blockquote{margin:14px 0;padding:12px 16px;border-left:5px solid var(--orange);background:var(--cream);border-radius:0 10px 10px 0;font-weight:600}
.doc ul{padding-left:22px}.doc li{margin:4px 0}.doc table{margin:10px 0}
.item{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border:1.5px solid var(--line);border-radius:10px;margin:6px 0;cursor:pointer}
.opt.right{border-color:var(--green);background:#eef5d6;font-weight:700}.opt.wrong{border-color:var(--bad);background:#fdecea}
.banner{background:var(--cream);border:1px solid #e2cf8f;border-radius:12px;padding:10px 14px;margin-bottom:14px}
.banner.bad{background:#fdecea;border-color:#f0aaa4}.banner.good{background:#e8f1c8;border-color:#b8d46a}
.sub2{border:1px dashed #d9c9a3;border-radius:12px;padding:12px;margin:10px 0}
.hero{background:var(--brown);color:var(--cream);text-align:center;padding:34px 16px 26px}
.hero img{width:230px;max-width:70%;height:auto}
.hero p{margin:8px 0 0;font-family:var(--serif);letter-spacing:.06em}
.code{font-family:var(--serif);font-size:2.2rem;letter-spacing:.14em;color:var(--orange-d);font-weight:700}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:var(--brown);color:var(--cream);padding:12px 20px;border-radius:99px;opacity:0;transition:.3s;pointer-events:none;z-index:99;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#busy{position:fixed;inset:0;background:rgba(252,247,232,.6);display:none;align-items:center;justify-content:center;z-index:98}
#busy.on{display:flex}#busy i{width:44px;height:44px;border:5px solid var(--cream);border-top-color:var(--orange);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
footer.tag{text-align:center;color:var(--mute);font-family:var(--serif);letter-spacing:.06em;font-size:.82rem;padding:20px 0 0}
.cert{background:#fff;border:6px double var(--orange);padding:28px}.cert h1{text-align:center}
.sig{display:flex;justify-content:space-around;margin-top:48px}.sig div{border-top:1px solid #000;padding-top:6px;width:35%;text-align:center}
@media (max-width:520px){body{font-size:16px}h1{font-size:1.35rem}header.top .sub{display:none}}
@media print{.no-print,header.top,nav.tabs,footer.tag{display:none!important}body{background:#fff}.wrap{padding:0}.card{border:0}}
</style>
</head>

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const todayIso = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const fmtDate = iso => iso ? String(iso).slice(0, 10).split('-').reverse().join('/') : '';
const fmtDT = iso => { if (!iso) return ''; const d = new Date(iso); return isNaN(d) ? '' : fmtDate(iso) + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const pct = r => Math.round(r * 100);
const bar = r => `<div class="bar" role="progressbar" aria-valuenow="${pct(r)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct(r)}%"></i></div>`;
const badge = (k, t) => `<span class="badge s-${k}">${esc(t)}</span>`;
const nameOf = s => [s.first, s.middle, s.last].filter(Boolean).join(' ');
let toastT;
function toast(m) { const el = $('#toast'); el.textContent = m; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 3500); }
let busyN = 0;
function busy(d) { busyN = Math.max(0, busyN + d); $('#busy').classList.toggle('on', busyN > 0); }
const inl = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
function tbl(rows) { const [h, ...b] = rows; return '<div class="tw"><table><tr>' + h.map(c => '<th>' + inl(c) + '</th>').join('') + '</tr>' + b.map(r => '<tr>' + r.map(c => '<td>' + inl(c) + '</td>').join('') + '</tr>').join('') + '</table></div>'; }
function md(t) {
  let o = '', ul = false, tb = null;
  for (const raw of String(t || '').split('\n')) {
    const l = raw.trim();
    if (l.startsWith('|')) { if (ul) { o += '</ul>'; ul = false; } (tb = tb || []).push(l.replace(/^\||\|$/g, '').split('|').map(c => c.trim())); continue; }
    if (tb) { o += tbl(tb); tb = null; }
    if (l.startsWith('- ')) { if (!ul) { o += '<ul>'; ul = true; } o += '<li>' + inl(l.slice(2)) + '</li>'; continue; }
    if (ul) { o += '</ul>'; ul = false; }
    if (!l) continue;
    if (l.startsWith('## ')) o += '<h3>' + inl(l.slice(3)) + '</h3>';
    else if (l.startsWith('# ')) o += '<h2>' + inl(l.slice(2)) + '</h2>';
    else if (l.startsWith('> ')) o += '<blockquote>' + inl(l.slice(2)) + '</blockquote>';
    else o += '<p>' + inl(l) + '</p>';
  }
  if (ul) o += '</ul>'; if (tb) o += tbl(tb);
  return o;
}

/* ---------- server calls ---------- */
function call(role, op, args) {
  const auth = role === 'staff' ? ui.code : role === 'admin' ? ui.pin : '';
  busy(1);
  const req = { role, auth, op, args: args || {} };
  const g = window.google && google.script && google.script.run;
  if (!g) {
    // Standalone web page (GitHub Pages): call the Apps Script web app as a JSON API
    return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(req) })
      .then(r => r.json())
      .catch(() => ({ ok: false, error: 'Could not reach the server. Please check your internet connection and try again.' }))
      .then(r => { busy(-1); return r || { ok: false, error: 'No response from the server.' }; });
  }
  return new Promise(res => {
    g.withSuccessHandler(r => { busy(-1); res(r || { ok: false, error: 'No response from the server.' }); })
      .withFailureHandler(e => { busy(-1); res({ ok: false, error: (e && e.message) || 'Server error. Please try again.' }); })
      .api(req);
  });
}
async function sop(op, args) { const r = await call('staff', op, args); if (!r.ok) { toast(r.error); return null; } if (r.data.me) D.me = r.data.me; return r.data; }
async function aop(op, args) {
  const r = await call('admin', op, args); if (!r.ok) { toast(r.error); return null; }
  const d = r.data; if (d._msg) toast(d._msg);
  Object.keys(d).forEach(k => { if (k[0] !== '_') A[k] = d[k]; });
  return d;
}
function go(view, id) { ui.view = view; ui.id = id || null; render(); window.scrollTo(0, 0); }

/* ---------- staff views ---------- */
function vStaffShell() {
  const tabs = [['home', '🏠', 'My steps'], ['forms', '📝', 'Forms'], ['docs', '📚', 'Documents'], ['quiz', '✅', 'Knowledge Check']];
  const cur = ui.view === 'doc' ? 'docs' : ui.view === 'practical' ? 'home' : ui.view;
  const body = { home: vHome, forms: vForms, docs: vDocs, doc: vDoc, quiz: vQuiz, practical: vPractical }[ui.view]();
  return header('<button class="btn light sm" data-act="logout">Sign out</button>') + `<div class="wrap">${body}${footer}</div>
  <nav class="tabs" aria-label="Main">${tabs.map(t => `<button class="${cur === t[0] ? 'on' : ''}" data-act="go" data-view="${t[0]}"><b>${t[1]}</b>${t[2]}</button>`).join('')}</nav>`;
}
function stepCard(n, title, text, status, view, locked, ok) {
  return `<div class="card"><button class="step" data-act="go" data-view="${view}" ${locked ? 'disabled' : ''}><div class="num ${ok ? 'ok' : ''}">${ok ? '✓' : n}</div><div class="info"><h3 style="margin:0">${title}</h3><div class="muted">${text}</div></div>${status}</button></div>`;
}
const reqDocs = () => D.docs.filter(d => d.required);
const docsDone = () => reqDocs().length > 0 && reqDocs().every(d => (D.me.docs[d.id] || {}).ackAt);
function vHome() {
  const m = D.me, pr = m.pr, due = pr.nextDue && pr.nextDue <= todayIso();
  const stn = m.stations.map(k => D.stations[k]).join(', ');
  return `<h1>Hi ${esc(m.first)}! 👋</h1>
  <div class="card"><div class="row" style="justify-content:space-between"><b>Your onboarding progress</b><b>${pct(pr.overall)}%</b></div>${bar(pr.overall)}
  <p class="muted" style="margin:8px 0 0">${m.signoff ? `🎉 Onboarding complete — signed off by ${esc(m.signoff.by)} on ${fmtDate(m.signoff.date)}.` : 'Complete the 4 steps below. Your manager signs you off at the end.'}</p>
  <p class="muted" style="margin:6px 0 0">Your stations: <b>${stn ? esc(stn) : 'not assigned yet — your manager will add them as you train'}</b></p></div>
  ${stepCard(1, 'Employment forms', `${pr.forms} of ${pr.formsTotal} forms emailed${pr.formsReceived ? ' · ' + pr.formsReceived + ' received' : ''}`, pr.forms >= pr.formsTotal ? badge('done', 'Complete') : pr.forms ? badge('doing', 'In progress') : badge('todo', 'To do'), 'forms', false, pr.forms >= pr.formsTotal)}
  ${stepCard(2, 'Required reading', `${pr.docs} of ${pr.docsTotal} required documents read — Staff Handbook and more`, pr.docs >= pr.docsTotal && pr.docsTotal ? badge('done', 'Complete') : pr.docs ? badge('doing', 'In progress') : badge('todo', 'To do'), 'docs', false, pr.docs >= pr.docsTotal && pr.docsTotal > 0)}
  ${stepCard(3, 'Knowledge Check', pr.best ? `Best result: ${pr.best.score}/${pr.best.total} (${pct(pr.best.score / pr.best.total)}%) · pass mark ${pct(D.settings.pass)}%${pr.nextDue ? ' · next check due ' + fmtDate(pr.nextDue) : ''}` : `${D.settings.quizN} random questions · pass mark ${pct(D.settings.pass)}%`, due ? badge('doing', 'Due now') : pr.passed ? badge('done', 'Passed') : !docsDone() ? badge('lock', 'Locked') : pr.best ? badge('fail', 'Not passed yet') : badge('todo', 'To do'), 'quiz', !docsDone(), pr.passed && !due)}
  ${stepCard(4, 'On-the-job sign-off', `${pr.pracDone} of ${pr.pracTotal} practical items signed off by your trainer`, m.signoff ? badge('signed', 'Signed off') : pr.pracDone >= pr.pracTotal ? badge('done', 'Ready for sign-off') : badge('doing', 'With your trainer'), 'practical', false, !!m.signoff)}`;
}
function vForms() {
  const m = D.me, st = D.settings, subject = `Employment forms - ${m.first} ${m.last} - ${m.code}`;
  return `<h1>Employment forms</h1>
  <div class="card"><h3>How it works</h3><ol style="padding-left:20px;margin:0">
  <li><b>Download</b> each form below (open it, then use the download button). The links are <b>view-only</b> — you cannot fill them in online.</li>
  <li><b>Fill in and sign</b> each form: type into the downloaded file, or print it and fill it in by hand. If you print it, take a clear photo or scan of every page.</li>
  <li>Email <b>all completed forms</b> to <b>${esc(st.returnEmail)}</b> with this subject:<br><code>${esc(subject)}</code></li>
  <li>Tick each form below once you have emailed it. We tick "Received" when it arrives.</li></ol>
  <div class="row" style="margin-top:12px"><a class="btn" href="mailto:${esc(st.returnEmail)}?subject=${encodeURIComponent(subject)}" target="_blank" rel="noopener">✉ Email my forms</a><a class="btn ghost" href="${esc(st.folderUrl)}" target="_blank" rel="noopener">📁 Open all forms folder</a></div></div>
  ${st.forms.map(f => { const rec = m.formsReceived[f.id]; return `<div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">${esc(f.title)}</h3>${rec ? badge('done', 'Received ' + fmtDate(rec.date)) : ''}</div>
  <div class="row" style="margin-top:8px"><a class="btn ghost sm" href="${esc(f.url)}" target="_blank" rel="noopener">Open &amp; download</a>
  <label class="row" style="gap:8px;cursor:pointer"><input type="checkbox" data-act="formSent" data-id="${esc(f.id)}" ${m.formsSent[f.id] || rec ? 'checked' : ''} ${rec ? 'disabled' : ''}> I have completed and emailed this form</label></div></div>`; }).join('')}`;
}
function docRow(d) {
  const r = D.me.docs[d.id] || {};
  return `<div class="card"><button class="step" data-act="openDoc" data-id="${esc(d.id)}"><div class="num ${r.ackAt ? 'ok' : ''}">${r.ackAt ? '✓' : esc(d.icon)}</div><div class="info"><h3 style="margin:0">${esc(d.title)}</h3><div class="muted">${r.ackAt ? 'Read & understood ' + fmtDT(r.ackAt) : r.openedAt ? 'Opened — not confirmed yet' : 'Not opened'}</div></div>${r.ackAt ? badge('done', 'Done') : d.required ? badge(r.openedAt ? 'doing' : 'todo', r.openedAt ? 'In progress' : 'To read') : badge('lock', 'Optional')}</button></div>`;
}
function vDocs() {
  const m = D.me, req = reqDocs(), opt = D.docs.filter(d => !d.required), nextReq = req.find(d => !(m.docs[d.id] || {}).ackAt);
  return `<h1>Documents</h1>
  <div class="card"><h3>How it works</h3><p class="muted" style="margin:0">Open a document, read it to the end, then tap <b>"I have read and understood"</b> — the next document opens automatically. <b>Required</b> documents are the ones for your station(s). <b>Recommended</b> documents are optional, but reading them helps you understand the whole store.</p>
  ${nextReq ? `<button class="btn block" style="margin-top:12px" data-act="openDoc" data-id="${esc(nextReq.id)}">${req.some(d => (m.docs[d.id] || {}).ackAt) ? 'Continue reading' : 'Start reading'} →</button>` : ''}</div>
  <h2>Required for you <span class="muted" style="font-family:inherit;letter-spacing:0">(${m.pr.docs} of ${m.pr.docsTotal} done)</span></h2>
  ${req.map(docRow).join('') || '<p class="muted">No required documents yet.</p>'}
  ${docsDone() ? `<div class="banner good">🎉 You have read all your required documents. <button class="btn sm" style="margin-left:8px" data-act="go" data-view="quiz">Go to Knowledge Check</button></div>` : ''}
  ${opt.length ? `<h2>Recommended <span class="muted" style="font-family:inherit;letter-spacing:0">(optional)</span></h2><p class="muted">These belong to other stations. You can read them any time — they are not required.</p>${opt.map(docRow).join('')}` : ''}`;
}
function vDoc() {
  const i = D.docs.findIndex(x => x.id === ui.id); if (i < 0) return vDocs();
  const d = D.docs[i], r = D.me.docs[d.id] || {}, prev = D.docs[i - 1], next = D.docs[i + 1], done = !!r.ackAt;
  const afterLabel = next ? 'Next document →' : 'Finish';
  return `<button class="btn ghost sm" data-act="go" data-view="docs">← All documents</button>
  <h1 style="margin-top:12px">${esc(d.icon)} ${esc(d.title)}</h1>
  ${d.required ? '' : '<div class="banner">📘 <b>Recommended reading</b> — not required for your station(s), but it helps you understand the whole store.</div>'}
  <div class="card doc">${md(d.body)}</div><div id="docend"></div>
  <div class="card">${done ? `<div class="banner good" style="margin:0 0 12px">✓ You confirmed on ${fmtDT(r.ackAt)} that you have read and understood this document.</div>` : `<p class="muted" id="ackhint">Scroll to the end of the document to continue.</p>`}
  <div class="row" style="flex-wrap:nowrap">${prev ? `<button class="btn ghost" data-act="openDoc" data-id="${esc(prev.id)}" aria-label="Previous document">←</button>` : ''}
  ${done ? (next ? `<button class="btn" style="flex:1" data-act="openDoc" data-id="${esc(next.id)}">Next document →</button>` : `<button class="btn" style="flex:1" data-act="go" data-view="docs">Back to all documents</button>`)
      : `<button class="btn" style="flex:1" id="ackbtn" data-act="ackNext" data-id="${esc(d.id)}" disabled>I have read and understood · ${afterLabel}</button>`}</div>
  <p style="margin:10px 0 0;text-align:center"><a href="#" data-act="go" data-view="docs">Back to all documents</a></p></div>`;
}
function checkEnd() {
  const b = $('#ackbtn'), e = $('#docend'); if (!b || !e) return;
  if (e.getBoundingClientRect().top < window.innerHeight - 10) { b.disabled = false; const h = $('#ackhint'); if (h) h.textContent = 'Thank you — you can confirm now.'; }
}
const bonusPts = a => (0.5 * (a.bonusCorrect || 0)).toFixed(1);
const attTxt = a => `${a.score}/${a.total} required (${pct(a.score / a.total)}%)${a.bonusTotal ? ` + ${bonusPts(a)} bonus` : ''}`;
const qTags = it => `${it.kind === 'bonus' ? '<span class="badge s-done">Bonus · 0.5 point</span> ' : ''}${it.critical ? '<span class="badge s-fail">⚠ Safety-critical</span> ' : ''}`;
function vQuiz() {
  const m = D.me;
  if (!docsDone()) return `<h1>Knowledge Check</h1><div class="banner">The Knowledge Check unlocks after you have read all required documents (${m.pr.docs} of ${m.pr.docsTotal} done).</div><button class="btn" data-act="go" data-view="docs">Go to documents</button>`;
  const shown = m.attempts.find(a => a.id === ui.attemptId);
  if (ui.id === 'result' && shown) return vAttempt(shown, true);
  if (m.pending) {
    const nb = m.pending.items.filter(i => i.kind === 'bonus').length;
    return `<h1>Knowledge Check</h1><p class="muted">Choose one answer for each question. ${m.pending.items.length - nb} required question${m.pending.items.length - nb === 1 ? '' : 's'}${nb ? ` + ${nb} bonus question${nb > 1 ? 's' : ''} from recommended reading you have read` : ''} · you need ${pct(D.settings.pass)}% of the required questions, and all safety-critical questions must be correct.</p>
    ${m.pending.items.map((it, i) => `<div class="card"><div style="margin-bottom:6px">${qTags(it)}</div><h3>${i + 1}. ${esc(it.q)}</h3>${it.options.map((o, j) => `<label class="opt"><input type="radio" name="q${i}" value="${j}"><span>${esc(o)}</span></label>`).join('')}</div>`).join('')}
    <button class="btn block" data-act="submitQuiz">Submit answers</button>`;
  }
  const due = m.pr.nextDue;
  return `<h1>Knowledge Check</h1><div class="card"><p>Answer about <b>${D.settings.quizN} random questions</b>, mostly from your required documents. You need <b>${pct(D.settings.pass)}%</b> of the required questions correct, and <b>every safety-critical question</b> must be right.</p>
  <p class="muted">If you have read any recommended documents, a few <b>bonus questions</b> from them may appear. Each correct bonus answer earns 0.5 point and <b>never counts against you</b>. Questions and answers are shuffled every time.</p>
  ${due ? `<p class="muted">You repeat this check about every ${Math.round(D.settings.refreshDays / 30)} months. Your next one is due <b>${fmtDate(due)}</b>${due <= todayIso() ? ' — <b>due now</b>' : ''}.</p>` : ''}
  <button class="btn" data-act="startQuiz">${m.attempts.length ? 'Start a new Knowledge Check' : 'Start Knowledge Check'}</button></div>
  ${m.attempts.length ? '<h2>My results</h2>' + m.attempts.slice().reverse().map(a => `<div class="card"><div class="row" style="justify-content:space-between"><div><b>${attTxt(a)}</b><br><span class="muted">${fmtDT(a.date)}</span></div><div class="row">${a.pass ? badge('done', 'Passed') : badge('fail', 'Not passed')}<button class="btn ghost sm" data-act="viewAttempt" data-id="${esc(a.id)}">Review</button></div></div></div>`).join('') : ''}`;
}
function vAttempt(a, mine) {
  return `<h1>${mine ? 'Your result' : 'Quiz result'}</h1>
  <div class="card"><div class="banner ${a.pass ? 'good' : 'bad'}" style="margin:0"><h2 style="margin:0">${a.score}/${a.total} required — ${pct(a.score / a.total)}%</h2>
  ${a.pass ? '🎉 Passed' : (a.critMissed ? 'Not passed — you missed ' + a.critMissed + ' safety-critical question' + (a.critMissed > 1 ? 's' : '') + '. These must all be correct.' : 'Not passed — you need ' + pct(a.passMark) + '% of the required questions.')} · ${fmtDT(a.date)}
  ${a.bonusTotal ? `<br>⭐ Bonus: ${a.bonusCorrect}/${a.bonusTotal} correct = ${bonusPts(a)} point${bonusPts(a) === '1.0' ? '' : 's'}` : ''}<br><span class="muted">Total points: ${(a.points !== undefined ? a.points : a.score).toFixed(1)}</span></div></div>
  ${!a.pass && mine ? '<div class="banner">Re-read the documents shown under each wrong answer, then try again. You will get a new random set of questions.</div>' : ''}
  ${a.items.map((it, i) => { const ok = it.pick === it.correct; return `<div class="card"><div style="margin-bottom:6px">${qTags(it)}</div><h3>${i + 1}. ${esc(it.q)} ${ok ? '✅' : '❌'}</h3>${it.options.map((o, j) => `<div class="opt ${j === it.correct ? 'right' : j === it.pick ? 'wrong' : ''}" style="cursor:default">${j === it.correct ? '✔' : j === it.pick ? '✘' : '○'} <span>${esc(o)}${j === it.pick ? ' <span class="muted">(selected)</span>' : ''}</span></div>`).join('')}${ok ? '' : `<div class="muted">Review: ${esc(it.docTitle)}</div>`}</div>`; }).join('')}
  ${mine ? `<button class="btn" data-act="go" data-view="quiz">Back</button>` : ''}`;
}
function vPractical() {
  const m = D.me;
  return `<button class="btn ghost sm" data-act="go" data-view="home">← My steps</button><h1 style="margin-top:12px">On-the-job sign-off</h1>
  <p class="muted">Your trainer or manager signs off each item once you have shown you can do it. ${m.pr.pracDone} of ${m.pr.pracTotal} done.</p>
  <div class="card">${D.practical.map(p => { const r = m.practical[p.id]; return `<div class="item"><div class="num ${r ? 'ok' : ''}" style="width:32px;height:32px;font-size:1rem">${r ? '✓' : ''}</div><div class="info">${esc(p.text)}${p.station !== 'all' ? ` <span class="badge s-todo">${esc(D.stations[p.station])}</span>` : ''}${r ? `<br><span class="muted">Signed ${fmtDate(r.date)}</span>` : ''}</div></div>`; }).join('')}</div>
  ${m.signoff ? `<div class="banner good">🎉 Onboarding signed off by ${esc(m.signoff.by)} on ${fmtDate(m.signoff.date)}.${m.signoff.note ? '<br>“' + esc(m.signoff.note) + '”' : ''}</div>` : ''}`;
}

/* ---------- admin views ---------- */
const stOf = id => A.staff.find(s => s.id === id);
const stationNames = s => (s.stations || []).map(k => A.stations[k]).join(', ') || 'No station yet';
function vAdminShell() {
  const tabs = [['dash', 'Overview'], ['staff', 'Staff'], ['results', 'Quiz results'], ['docs', 'Documents'], ['bank', 'Quiz bank'], ['settings', 'Settings']];
  if (ui.view === 'record') return vRecord();
  let body;
  if (ui.view === 'staffd') body = vStaffDetail(); else if (ui.view === 'attempt') body = vAdminAttempt();
  else body = { dash: vDash, staff: vStaffList, results: vResults, docs: vDocsAdmin, bank: vBank, settings: vSettings }[ui.atab]();
  const cur = ui.view === 'staffd' ? 'staff' : ui.view === 'attempt' ? 'results' : ui.atab;
  const unassigned = A.staff.filter(s => !(s.stations || []).length).length;
  return header('<button class="btn light sm" data-act="logout">Sign out</button>') + `<div class="wrap">
  <div class="atabs" role="tablist">${tabs.map(t => `<button class="${cur === t[0] ? 'on' : ''}" data-act="atab" data-tab="${t[0]}">${t[1]}</button>`).join('')}</div>
  ${unassigned ? `<div class="banner">👤 ${unassigned} team member${unassigned > 1 ? 's have' : ' has'} no station yet. Open <b>Staff</b> to assign.</div>` : ''}${body}${footer}</div>`;
}
function overallBadge(s) {
  if (s.signoff) return badge('signed', 'Signed off');
  const o = s.pr.overall; return o >= 1 ? badge('done', 'Ready to sign off') : o > 0 ? badge('doing', 'In progress') : badge('todo', 'Not started');
}
function vDash() {
  if (!A.staff.length) return `<div class="card"><h2>Welcome</h2><p>No staff yet. Send new team members the registration link (Staff tab) or add them manually.</p></div>`;
  const today = todayIso(), od = A.staff.filter(s => s.pr.nextDue && s.pr.nextDue < today).length, signed = A.staff.filter(s => s.signoff).length;
  const rows = A.staff.map(s => { const p = s.pr; return `<tr><td><a href="#" data-act="go" data-view="staffd" data-id="${s.id}"><b>${esc(nameOf(s))}</b></a><br><span class="muted">${esc(stationNames(s))}</span></td>
  <td class="c">${p.forms}/${p.formsTotal}<br><span class="muted">rec. ${p.formsReceived}</span></td><td class="c">${p.docs}/${p.docsTotal}</td><td class="c">${p.best ? `<span class="badge ${p.best.pass ? 's-done' : 's-fail'}">${pct(p.best.score / p.best.total)}%</span>` : '–'}</td>
  <td class="c">${p.nextDue ? (p.nextDue < today ? `<span class="badge s-fail">${fmtDate(p.nextDue)}</span>` : fmtDate(p.nextDue)) : '–'}</td><td class="c">${p.pracDone}/${p.pracTotal}</td><td class="c"><b>${pct(p.overall)}%</b></td><td>${overallBadge(s)}</td></tr>`; }).join('');
  return `<div class="grid" style="margin-bottom:14px"><div class="card"><div class="muted">Staff</div><h1 style="margin:0">${A.staff.length}</h1></div><div class="card"><div class="muted">Signed off</div><h1 style="margin:0">${signed}</h1></div><div class="card"><div class="muted">Quiz overdue</div><h1 style="margin:0;color:${od ? 'var(--bad)' : 'inherit'}">${od}</h1></div></div>
  <div class="card"><div class="tw"><table><tr><th>Team member</th><th class="c">Forms</th><th class="c">Docs read</th><th class="c">Best quiz</th><th class="c">Next quiz due</th><th class="c">Practical</th><th class="c">Overall</th><th>Status</th></tr>${rows}</table></div></div>`;
}
function stationBoxes(prefix, sel) {
  return `<div class="row">${Object.entries(A.stations).map(([k, v]) => `<label class="row" style="gap:6px"><input type="checkbox" class="${prefix}-st" value="${k}" ${(sel || []).includes(k) ? 'checked' : ''}> ${esc(v)}</label>`).join('')}</div>`;
}
function staffForm(p, s) {
  s = s || {};
  return `<div class="grid"><div><label class="f req" for="${p}-first">First name</label><input id="${p}-first" value="${esc(s.first)}"></div><div><label class="f" for="${p}-middle">Middle name</label><input id="${p}-middle" value="${esc(s.middle)}"></div><div><label class="f req" for="${p}-last">Last name</label><input id="${p}-last" value="${esc(s.last)}"></div>
  <div><label class="f req" for="${p}-dob">Date of birth</label><input id="${p}-dob" type="date" value="${esc(s.dob)}"></div><div><label class="f req" for="${p}-email">Email</label><input id="${p}-email" type="email" value="${esc(s.email)}"></div><div><label class="f req" for="${p}-phone">Phone</label><input id="${p}-phone" type="tel" value="${esc(s.phone)}"></div></div>

function readStaffForm(p) {

  return { first: v('first'), middle: v('middle'), last: v('last'), dob: v('dob'), email: v('email'), phone: v('phone'), stations: $$('.' + p + '-st:checked').map(c => c.value) };
}
function vStaffList() {

  const rows = A.staff.map(s => ui.editStaff === s.id
    ? `<div class="sub2">${staffForm('es', s)}<div class="row" style="margin-top:10px"><button class="btn sm" data-act="saveStaff" data-id="${s.id}">Save</button><button class="btn ghost sm" data-act="cancelStaff">Cancel</button></div><p class="muted">Changing the first name, last name or birth date creates a new staff code.</p></div>`
    : `<div class="item" style="align-items:center"><div class="info"><a href="#" data-act="go" data-view="staffd" data-id="${s.id}"><b>${esc(nameOf(s))}</b></a> <span class="muted">${esc(stationNames(s))}</span><br><span class="muted">Staff code: <b style="letter-spacing:.08em">${esc(s.code)}</b> · ${esc(s.email)}</span>${bar(s.pr.overall)}</div><b>${pct(s.pr.overall)}%</b><button class="btn ghost sm" data-act="editStaff" data-id="${s.id}">Edit</button><button class="btn bad sm" data-act="delStaff" data-id="${s.id}">Delete</button></div>`).join('');

  <div class="card"><h2>Add team member manually</h2>${staffForm('ns', {})}
  <label class="row" style="gap:8px;margin-top:10px"><input type="checkbox" id="ns-send" checked> Email them their staff code and forms link</label>

function vStaffDetail() {
  const s = stOf(ui.id); if (!s) return vStaffList();
  const isReq = d => d.stations.includes('all') || d.stations.some(k => (s.stations || []).includes(k));
  const docs = A.docs.filter(isReq), optDocs = A.docs.filter(d => !isReq(d));
  const items = A.practical.filter(p => p.station === 'all' || (s.stations || []).includes(p.station));
  const p = s.pr, allDone = p.forms >= p.formsTotal && p.docs >= p.docsTotal && p.passed && p.pracDone >= p.pracTotal;

/* ---------- actions ---------- */
const val = id => ($('#' + id) || { value: '' }).value.trim();
async function enterStaff(code) {
  ui.code = code; const r = await call('staff', 'load');
  if (!r.ok) { toast(r.error); return; }
  D = r.data; ui.role = 'staff'; ui.view = 'home'; ui.regDone = null; render(); window.scrollTo(0, 0);
}
async function act(t) {
  const d = t.dataset;
  switch (d.act) {
    case 'toRegister': ui.view = 'register'; render(); break;
    case 'toLogin': ui.view = 'login'; ui.regDone = null; render(); break;
    case 'register': {
      const a = { join: JOIN, first: val('r-first'), middle: val('r-middle'), last: val('r-last'), dob: val('r-dob'), email: val('r-email'), phone: val('r-phone') };
      const r = await call('public', 'register', a); if (!r.ok) { toast(r.error); return; }
      ui.regDone = r.data; render(); window.scrollTo(0, 0); break;
    }
    case 'signInWith': enterStaff(d.code); break;
    case 'asStaff': { const c = val('code').toUpperCase().replace(/\s/g, ''); if (!c) { toast('Enter your staff code'); return; } enterStaff(c); break; }
    case 'asAdmin': {
      ui.pin = val('pin'); const r = await call('admin', 'load'); if (!r.ok) { ui.pin = ''; toast(r.error); return; }
      A = r.data; ui.role = 'admin'; ui.view = 'admin'; ui.atab = 'dash'; render(); break;
    }
    case 'logout': ui.role = null; ui.code = ui.pin = ''; D = A = null; ui.view = JOIN ? 'register' : 'login'; render(); break;
    case 'go': ui.view = d.view; ui.id = d.id || null; render(); window.scrollTo(0, 0); break;
    case 'atab': ui.atab = d.tab; ui.view = 'admin'; ui.editStaff = ui.editDoc = ui.editQ = null; render(); window.scrollTo(0, 0); break;

    /* staff */
    case 'formSent': { const ok = await sop('formSent', { formId: d.id, value: t.checked }); render(); if (ok) toast(t.checked ? 'Noted — thank you' : 'Unticked'); break; }
    case 'openDoc': { ui.view = 'doc'; ui.id = d.id; render(); window.scrollTo(0, 0); await sop('openDoc', { docId: d.id }); break; }
    case 'ackNext': {
      const ok = await sop('ack', { docId: d.id }); if (!ok) break;
      const i = D.docs.findIndex(x => x.id === d.id), next = D.docs[i + 1];
      toast('Recorded ✓');
      if (next && (next.required || !docsDone())) { ui.view = 'doc'; ui.id = next.id; render(); window.scrollTo(0, 0); sop('openDoc', { docId: next.id }); }
      else { ui.view = 'docs'; ui.id = null; render(); window.scrollTo(0, 0); }
      break;
    }
    case 'startQuiz': { const ok = await sop('startQuiz'); if (ok) { ui.id = null; render(); window.scrollTo(0, 0); } break; }
    case 'submitQuiz': {
      const n = D.me.pending.items.length, picks = [];
      for (let i = 0; i < n; i++) { const r = $(`input[name="q${i}"]:checked`); if (!r) { toast('Please answer question ' + (i + 1)); return; } picks.push(+r.value); }
      const r = await sop('submitQuiz', { picks }); if (r) { ui.view = 'quiz'; ui.id = 'result'; ui.attemptId = r.attemptId; render(); window.scrollTo(0, 0); } break;
    }
    case 'viewAttempt': ui.view = 'quiz'; ui.id = 'result'; ui.attemptId = d.id; render(); window.scrollTo(0, 0); break;

    /* admin */
    case 'addStaff': { const a = readStaffForm('ns'); a.sendEmail = $('#ns-send').checked; if (await aop('saveStaff', a)) render(); break; }
    case 'editStaff': ui.editStaff = d.id; render(); break;
    case 'cancelStaff': ui.editStaff = null; render(); break;
    case 'saveStaff': { const a = readStaffForm('es'); a.id = d.id; if (await aop('saveStaff', a)) { ui.editStaff = null; render(); } break; }
    case 'delStaff': { const s = stOf(d.id); if (confirm(`Delete ${nameOf(s)} and all their onboarding data? This cannot be undone.`)) { if (await aop('deleteStaff', { id: s.id })) render(); } break; }
    case 'saveStations': { const s = stOf(d.id), a = { ...s, stations: $$('.sd-st:checked').map(c => c.value), id: s.id }; if (await aop('saveStaff', a)) render(); break; }
    case 'resendCode': await aop('resendCode', { id: d.id }); break;
    case 'prac': { if (await aop('practical', { staffId: d.sid, itemId: d.id, value: t.checked })) render(); break; }
    case 'formReceived': { if (await aop('formReceived', { staffId: d.sid, formId: d.id, value: t.checked })) render(); break; }
    case 'signoff': { if (await aop('signoff', { staffId: d.id, by: val('so-by'), note: val('so-note') })) render(); break; }
    case 'revokeSign': if (confirm('Remove this sign-off?')) { if (await aop('signoff', { staffId: d.id, revoke: true })) render(); } break;
    case 'adminAttempt': ui.sid = d.sid; ui.id = d.id; ui.view = 'attempt'; render(); window.scrollTo(0, 0); break;
    case 'record': ui.view = 'record'; ui.id = d.id; render(); window.scrollTo(0, 0); break;
    case 'print': window.print(); break;
    case 'copyLink': { const i = $('#reglink'); i.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) { } toast(ok ? 'Link copied' : 'Press Ctrl+C to copy the selected link'); break; }
    case 'newDoc': ui.editDoc = 'new'; render(); break;
    case 'editDoc': ui.editDoc = d.id; render(); window.scrollTo(0, 0); break;
    case 'cancelDoc': ui.editDoc = null; render(); break;
    case 'saveDoc': {
      const doc = { id: ui.editDoc === 'new' ? '' : ui.editDoc, title: val('ed-title'), icon: val('ed-icon'), stations: $$('.ed-st:checked').map(c => c.value), body: $('#ed-body').value };
      if (await aop('saveDoc', { doc })) { ui.editDoc = null; render(); } break;
    }
    case 'delDoc': { const dd = A.docs.find(x => x.id === d.id); if (confirm(`Delete "${dd.title}" and its quiz questions?`)) { if (await aop('deleteDoc', { id: d.id })) render(); } break; }
    case 'qfilter': ui.qfilter = t.value; render(); break;
    case 'newQ': ui.editQ = 'new'; render(); break;
    case 'editQ': ui.editQ = d.id; render(); break;
    case 'cancelQ': ui.editQ = null; render(); break;
    case 'saveQ': {
      const r = $('input[name="eq-a"]:checked'), question = { id: ui.editQ === 'new' ? '' : ui.editQ, docId: $('#eq-doc').value, q: val('eq-q'), options: $$('.eq-o').map(o => o.value.trim()), answer: r ? +r.value : 0, critical: $('#eq-crit').checked };
      if (await aop('saveQuestion', { question })) { ui.editQ = null; render(); } break;
    }
    case 'delQ': if (confirm('Delete this question?')) { if (await aop('deleteQuestion', { id: d.id })) render(); } break;
    case 'saveSettings': {
      const groups = {}; $$('.pr-box').forEach(b => groups[b.dataset.k] = b.value);
      const a = { pass: val('s-pass'), quizN: val('s-n'), refreshDays: val('s-days'), bonusPct: val('s-bonus'), criticalN: val('s-crit'), managerEmail: val('s-mgr'), returnEmail: val('s-ret'), folderUrl: val('s-folder'), formsText: $('#s-forms').value, newPin: val('s-pin'), practicalGroups: groups };
      const r = await aop('saveSettings', a); if (r) { if (a.newPin) ui.pin = a.newPin; render(); } break;
    }
    case 'newJoinKey': if (confirm('Create a new registration link? The old link will stop working.')) { if (await aop('newJoinKey')) render(); } break;
  }
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t || t.matches('input,select,textarea')) return;
  if (t.tagName === 'A' && t.getAttribute('href') === '#') e.preventDefault();
  act(t);
});
document.addEventListener('change', e => { const t = e.target; if (t.dataset && t.dataset.act && t.matches('input[type=checkbox],select')) act(t); });
document.addEventListener('keydown', e => { if (e.key === 'Enter') { if (e.target.id === 'code') act($('[data-act=asStaff]')); if (e.target.id === 'pin') act($('[data-act=asAdmin]')); } });
window.addEventListener('scroll', () => { if (ui.view === 'doc') checkEnd(); }, { passive: true });
window.addEventListener('resize', () => { if (ui.view === 'doc') checkEnd(); });
render();
</script>
</body>
</html>
